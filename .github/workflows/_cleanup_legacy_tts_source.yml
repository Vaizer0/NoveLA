name: Temporary TTS source cleanup

on:
  push:
    branches:
      - feat/youtube-tts-video-generation-system

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove unused audio source setting from UI/state
        run: |
          python3 - <<'PY'
          from pathlib import Path

          body = Path('features/settings/src/main/java/my/noveldokusha/settings/SettingsScreenBody.kt')
          s = body.read_text()
          s = s.replace('    onAudioSourceChange: (my.noveldokusha.core.appPreferences.TtsAudioSource) -> Unit,\n', '')
          s = s.replace('            source = state.audioSource.value,\n', '')
          s = s.replace('            onSourceChange = onAudioSourceChange,\n', '')
          body.write_text(s)

          state = Path('features/settings/src/main/java/my/noveldokusha/settings/SettingsScreenState.kt')
          s = state.read_text()
          s = s.replace('import my.noveldokusha.core.appPreferences.TtsAudioSource\n', '')
          s = s.replace('    val audioSource: State<TtsAudioSource>,' , '')
          state.write_text(s)

          vm = Path('features/settings/src/main/java/my/noveldokusha/settings/SettingsViewModel.kt')
          s = vm.read_text()
          s = s.replace('import my.noveldokusha.core.appPreferences.TtsAudioSource\n', '')
          s = s.replace('        audioSource = appPreferences.TTS_AUDIO_DOWNLOAD_SOURCE.state(viewModelScope),\n', '')
          s = s.replace('''\n    fun onAudioSourceChange(source: TtsAudioSource) {\n        appPreferences.TTS_AUDIO_DOWNLOAD_SOURCE.value = source\n    }\n''', '\n')
          vm.write_text(s)

          audio = Path('features/settings/src/main/java/my/noveldokusha/settings/sections/SettingsTtsAudioDownload.kt')
          s = audio.read_text()
          s = s.replace('import android.speech.tts.TextToSpeech\n', 'import android.speech.tts.TextToSpeech\n')
          s = s.replace('import androidx.compose.material.icons.outlined.LibraryMusic\n', '')
          s = s.replace('''    source: TtsAudioSource,\n''', '')
          s = s.replace('''    onSourceChange: (TtsAudioSource) -> Unit,\n''', '')
          start = s.find('''        SlimListItem(\n            headlineContent = { Text(text = stringResource(StringsR.string.settings_audio_download_source)) },''')
          if start < 0: raise SystemExit('audio source row not found')
          end = s.find('''        SlimListItem(\n            headlineContent = { Text(text = stringResource(StringsR.string.settings_audio_download_folder)) },''', start)
          if end < 0: raise SystemExit('audio folder row not found')
          s = s[:start] + s[end:]
          start = s.find('''    if (openSourceDialog) {''')
          if start < 0: raise SystemExit('source dialog not found')
          end = s.find('''    if (openVoiceDialog) {''', start)
          if end < 0: raise SystemExit('voice dialog marker not found')
          s = s[:start] + s[end:]
          start = s.find('''@Composable\nprivate fun sourceLabel(source: TtsAudioSource): String =''')
          if start >= 0:
              end = s.find('''@Composable\nprivate fun VoicePickerDialog(''', start)
              if end < 0: raise SystemExit('voice picker marker not found')
              s = s[:start] + s[end:]
          s = s.replace('import androidx.compose.material.icons.filled.Check\n', 'import androidx.compose.material.icons.filled.Check\n')
          s = s.replace('import my.noveldokusha.core.appPreferences.TtsAudioSource\n', '')
          audio.write_text(s)

          prefs = Path('core/src/main/java/my/noveldokusha/core/appPreferences/AppPreferences.kt')
          s = prefs.read_text()
          s = s.replace('''    /** Источник текста для загрузки аудио: ORIGINAL / TRANSLATED / ASK_EVERY_TIME. */\n    val TTS_AUDIO_DOWNLOAD_SOURCE =''', '''    /** @deprecated Source selection is now explicit per chapter export; retained only for backward-compatible preference migration. */\n    @Deprecated("No longer used by the audio/video export UI")\n    val TTS_AUDIO_DOWNLOAD_SOURCE =''', 1)
          prefs.write_text(s)
          print('legacy audio source UI/state removed; preference retained only for compatibility')
          PY
      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add features/settings/src/main/java/my/noveldokusha/settings core/src/main/java/my/noveldokusha/core/appPreferences/AppPreferences.kt
          git diff --cached --quiet && exit 0
          git commit -m 'refactor: remove unused TTS audio source setting [skip ci]'
          git push
