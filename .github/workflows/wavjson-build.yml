name: wavjson Build

on:
  push:
    branches: [wavjson]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Run text-to-speech unit tests
        run: ./gradlew :tooling:text_to_speech:test --no-daemon --console=plain
      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --console=plain
      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon --console=plain
      - name: Verify APK artifacts
        run: |
          test -n "$(find app/build/outputs/apk/debug -name '*.apk' -type f -print -quit)"
          test -n "$(find app/build/outputs/apk/release -name '*.apk' -type f -print -quit)"
      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: NoveLA-wavjson-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
      - name: Upload release APK
        uses: actions/upload-artifact@v7
        with:
          name: NoveLA-wavjson-release
          path: app/build/outputs/apk/release/*.apk
          retention-days: 14
