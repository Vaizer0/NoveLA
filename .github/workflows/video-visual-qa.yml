name: Video Renderer Visual QA

on:
  push:
    branches:
      - feat/youtube-tts-video-generation-system

permissions:
  contents: read

concurrency:
  group: video-visual-qa-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual-qa:
    # macOS gives the Android emulator hardware hypervisor acceleration; the
    # previous Ubuntu runner remained offline because KVM was unavailable.
    runs-on: macos-13
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.3.0
      - name: Remove local Java home from gradle.properties
        run: sed -i '/org\.gradle\.java\.home/d' gradle.properties
      - name: Run renderer visual QA on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -no-audio -no-boot-anim
          disable-animations: true
          emulator-boot-timeout: 600
          script: ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=my.noveldokusha.TtsVideoVisualQaTest --no-daemon --stacktrace
      - name: Collect PNG frames
        if: always()
        run: |
          mkdir -p visual-qa
          if adb shell "run-as my.novela.vaizer0.debug sh -c 'find files/tts-video-qa -maxdepth 1 -name \"*.png\" -print0'" > /tmp/qa-files 2>/dev/null; then
            tr '\0' '\n' < /tmp/qa-files | while read -r remote; do
              [ -z "$remote" ] && continue
              name=$(basename "$remote")
              adb exec-out run-as my.novela.vaizer0.debug cat "$remote" > "visual-qa/$name"
            done
          fi
          count=$(find visual-qa -maxdepth 1 -type f -name '*.png' | wc -l | tr -d ' ')
          echo "Collected PNG frames: $count"
          echo "count=$count" >> "$GITHUB_OUTPUT"
        id: collect
      - name: Verify six visual QA frames were produced
        if: success()
        env:
          COUNT: ${{ steps.collect.outputs.count }}
        run: test "$COUNT" -eq 6
      - name: Upload rendered PNG frames
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: NoveLA-video-visual-qa
          path: visual-qa/*.png
          if-no-files-found: error
          retention-days: 14
