          text = read(mini)
          if 'rememberSaveable' not in text:
              text = text.replace('import androidx.compose.runtime.remember\n', 'import androidx.compose.runtime.remember\nimport androidx.compose.runtime.saveable.rememberSaveable\n', 1)

          # Replace duration source in FloatingTtsMiniPlayer.
          old = '''    val total = state.estimatedTotalSeconds.value\n    val remaining = state.estimatedRemainingSeconds.value\n    val progress = if (total > 0) (total - remaining).toFloat() / total else 0f\n'''
          new = '''    val durationEnabled = state.ttsDurationEnabled.value\n    val measuredTotalMs = state.chapterTtsDurationMs.value ?: 0L\n    val measuredCurrentMs = state.chapterTtsDurationCurrentMs.value\n    val measuredRemainingMs = state.chapterTtsDurationRemainingMs.value\n    val total = if (durationEnabled) (measuredTotalMs / 1000L).toInt() else state.estimatedTotalSeconds.value\n    val remaining = if (durationEnabled) (measuredRemainingMs / 1000L).toInt() else state.estimatedRemainingSeconds.value\n    val current = if (durationEnabled) (measuredCurrentMs / 1000L).toInt() else (total - remaining).coerceAtLeast(0)\n    val progress = if (durationEnabled) state.chapterTtsDurationProgress.value\n    else if (total > 0) (total - remaining).toFloat() / total else 0f\n    var showTotalDuration by rememberSaveable { mutableStateOf(false) }\n'''
          if old in text:
              text = text.replace(old, new, 1)

          # Replace MiniPlayerControls signature and call with current/duration flags.
          old_sig = '''    animatedProgress: Float,\n    remaining: Int,\n'''
          new_sig = '''    animatedProgress: Float,\n    current: Int,\n    remaining: Int,\n    durationEnabled: Boolean,\n    showTotalDuration: Boolean,\n    onToggleDurationMode: () -> Unit,\n'''
          if old_sig in text and 'onToggleDurationMode' not in text:
              text = text.replace(old_sig, new_sig, 1)

          # Replace the existing Surface time badge with conditional timeline text.
          surface_time = re.compile(r'''        Surface\(\n            shape = RoundedCornerShape\(16\.dp\),\n            color = MaterialTheme\.colorScheme\.primaryContainer,\n        \) \{\n            Row\(\n                verticalAlignment = Alignment\.CenterVertically,\n                modifier = Modifier\.padding\(horizontal = badgeHorizPad, vertical = badgeVertPad\)\n            \) \{\n                Icon\(\n                    Icons\.Rounded\.AccessTime,\n                    contentDescription = null,\n                    tint = MaterialTheme\.colorScheme\.onPrimaryContainer,\n                    modifier = Modifier\.size\(14\.dp\)\n                \)\n                Spacer\(Modifier\.width\(4\.dp\)\)\n                Text\(\n                    text = formatDuration\(remaining\),\n                    style = MaterialTheme\.typography\.labelSmall,\n                    fontWeight = FontWeight\.Bold,\n                    color = MaterialTheme\.colorScheme\.onPrimaryContainer,\n                \)\n            \}\n        \}\n''')
          replacement_time = '''        if (durationEnabled) {\n            Text(\n                text = formatDuration(current),\n                style = MaterialTheme.typography.labelSmall,\n                fontWeight = FontWeight.Medium,\n                color = MaterialTheme.colorScheme.onSurfaceVariant,\n            )\n            Text(\n                text = if (showTotalDuration) formatDuration((state.chapterTtsDurationMs.value ?: 0L).div(1000L).toInt()) else "-${formatDuration(remaining)}",\n                style = MaterialTheme.typography.labelSmall,\n                fontWeight = FontWeight.Medium,\n                color = MaterialTheme.colorScheme.onSurfaceVariant,\n                modifier = Modifier\n                    .clip(RoundedCornerShape(4.dp))\n                    .clickable(onClick = onToggleDurationMode)\n                    .padding(horizontal = 2.dp, vertical = 1.dp),\n            )\n        } else {\n            Surface(\n                shape = RoundedCornerShape(16.dp),\n                color = MaterialTheme.colorScheme.primaryContainer,\n            ) {\n                Row(\n                    verticalAlignment = Alignment.CenterVertically,\n                    modifier = Modifier.padding(horizontal = badgeHorizPad, vertical = badgeVertPad)\n                ) {\n                    Icon(\n                        Icons.Rounded.AccessTime,\n                        contentDescription = null,\n                        tint = MaterialTheme.colorScheme.onPrimaryContainer,\n                        modifier = Modifier.size(14.dp)\n                    )\n                    Spacer(Modifier.width(4.dp))\n                    Text(\n                        text = formatDuration(remaining),\n                        style = MaterialTheme.typography.labelSmall,\n                        fontWeight = FontWeight.Bold,\n                        color = MaterialTheme.colorScheme.onPrimaryContainer,\n                    )\n                }\n            }\n        }\n'''
          if surface_time.search(text):
              text = surface_time.sub(replacement_time, text, count=1)

          # Add current/duration params to MiniPlayerControls call.
          call_marker = '''                        animatedProgress = animatedProgress,\n                        remaining = remaining,\n'''
          if call_marker in text and 'durationEnabled = durationEnabled' not in text:
              text = text.replace(call_marker, '''                        animatedProgress = animatedProgress,\n                        current = current,\n                        remaining = remaining,\n                        durationEnabled = durationEnabled,\n                        showTotalDuration = showTotalDuration,\n                        onToggleDurationMode = { showTotalDuration = !showTotalDuration },\n''', 1)

          write(mini, text)

          # ------------------------------------------------------------
          # Keep temporary workflow only for this build/verification cycle.
          # ------------------------------------------------------------
          print('TTS duration source modifications applied successfully')
      
      - name: Run focused tests and build APK
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :tooling:text_to_speech:test --no-daemon --console=plain
          ./gradlew :app:assembleDebug --no-daemon --console=plain
          ./gradlew :app:assembleRelease --no-daemon --console=plain

      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add accurate TTS chapter duration [skip ci]"
          git push origin HEAD:feat/tts-chapter-duration

      - name: Remove temporary workflow after green build
        shell: bash
        run: |
          rm -f .github/workflows/tts-duration-implementation.yml
          git add .github/workflows/tts-duration-implementation.yml
          git commit -m "chore: remove temporary implementation workflow [skip ci]"
          git push origin HEAD:feat/tts-chapter-duration
