        uses: actions/checkout@v4
        with:
          ref: feat/tts-chapter-duration
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Apply TTS duration implementation
