name: Implement TTS Chapter Duration

on:
  push:
    branches:
      - feat/tts-chapter-duration

permissions:
  contents: write

jobs:
  implement:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/tts-chapter-duration
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Apply TTS duration implementation
        shell: python
        run: |
          from pathlib import Path
          import re

          root = Path('.')

          def read(rel):
              return (root / rel).read_text(encoding='utf-8')

          def write(rel, text):
              (root / rel).write_text(text, encoding='utf-8')

          # ------------------------------------------------------------
          # AppPreferences: persisted opt-in toggle.
          # ------------------------------------------------------------
          prefs = 'core/src/main/java/my/noveldokusha/core/appPreferences/AppPreferences.kt'
          text = read(prefs)
          marker = '''    val TTS_HIGHLIGHT_COLOR = object : Preference<String>("TTS_HIGHLIGHT_COLOR") {\n        override var value by SharedPreference_String(name, preferences, "FFFF6D00")\n    }\n'''
          addition = marker + '''\n    /** Enables measured chapter-level TTS duration and its floating-player timeline. */\n    val TTS_DURATION_ENABLED = object : Preference<Boolean>("TTS_DURATION_ENABLED") {\n        override var value by SharedPreference_Boolean(name, preferences, false)\n    }\n'''
          if 'TTS_DURATION_ENABLED' not in text:
              if marker not in text:
                  raise SystemExit('AppPreferences marker not found')
              text = text.replace(marker, addition, 1)
              write(prefs, text)

          # ------------------------------------------------------------
          # Strings.
          # ------------------------------------------------------------
          strings = 'strings/src/main/res/values/strings.xml'
          text = read(strings)
          if 'name="tts_chapter_duration"' not in text:
              close = '</resources>'
              if close not in text:
                  raise SystemExit('strings.xml closing resources tag not found')
              entry = '''    <string name="tts_chapter_duration">TTS chapter duration</string>\n'''
              text = text.replace(close, entry + close, 1)
              write(strings, text)

          # ------------------------------------------------------------
          # New isolated measurement backend.
          # ------------------------------------------------------------
          backend = root / 'tooling/text_to_speech/src/main/java/my/noveldokusha/text_to_speech/ChapterTtsDurationManager.kt'
          backend.parent.mkdir(parents=True, exist_ok=True)
          backend.write_text(r'''package my.noveldokusha.text_to_speech

import android.os.Bundle
import android.os.ParcelFileDescriptor
import android.speech.tts.TextToSpeech
import android.speech.tts.UtteranceProgressListener
import androidx.core.content.edit
import java.io.File
import java.security.MessageDigest
import java.util.concurrent.CountDownLatch
import java.util.concurrent.TimeUnit
import java.util.concurrent.atomic.AtomicReference

/**
 * Measures the duration of TTS-generated audio without playing or retaining the audio.
 * This class is deliberately isolated from TextToSpeechManager playback behavior.
 */
class ChapterTtsDurationManager(
    private val context: android.content.Context,
) {
    data class Config(
        val enginePackage: String,
        val voiceId: String,
        val localeTag: String,
        val speed: Float,
        val pitch: Float,
    )

    sealed interface Result {
        data class Measured(val durationMs: Long) : Result
        data object Unsupported : Result
        data object Empty : Result
        data object Failed : Result
    }

    private data class AudioFormatInfo(
        val sampleRate: Int,
        val audioFormat: Int,
        val channelCount: Int,
    )

    private val prefs by lazy {
        context.getSharedPreferences("tts_duration_cache", android.content.Context.MODE_PRIVATE)
    }

    @Volatile
    private var activeTts: TextToSpeech? = null

    private val cachePrefix = "duration_v2_"

    fun cancel() {
        runCatching { activeTts?.stop() }
    }

    fun cachedDuration(text: String, config: Config): Long? {
        val key = cacheKey(text, config)
        val value = prefs.getLong(key, Long.MIN_VALUE)
        return value.takeIf { it >= 0L }
    }

    fun cacheDuration(text: String, config: Config, durationMs: Long) {
        if (durationMs <= 0L) return
        prefs.edit { putLong(cacheKey(text, config), durationMs) }
    }

    fun measureBlocking(text: String, config: Config, timeoutPerSliceMs: Long = 20_000L): Result {
        if (text.isBlank()) return Result.Empty
        cachedDuration(text, config)?.let { return Result.Measured(it) }

        val ready = CountDownLatch(1)
        val initError = AtomicReference<Int?>(null)
        var tts: TextToSpeech? = null
        tts = if (config.enginePackage.isBlank()) {
            TextToSpeech(context) { status ->
                if (status != TextToSpeech.SUCCESS) initError.set(status)
                ready.countDown()
            }
        } else {
            TextToSpeech(context, { status ->
                if (status != TextToSpeech.SUCCESS) initError.set(status)
                ready.countDown()
            }, config.enginePackage)
        }
        activeTts = tts

        return try {
            if (!ready.await(10, TimeUnit.SECONDS) || initError.get() != null) return Result.Unsupported

            val voice = tts.voices?.firstOrNull { it.name == config.voiceId }
                ?: tts.voices?.firstOrNull { it.locale.toLanguageTag() == config.localeTag }
                ?: tts.voice
                ?: return Result.Unsupported

            runCatching { tts.voice = voice }.getOrElse { return Result.Unsupported }
            if (tts.setSpeechRate(config.speed) != TextToSpeech.SUCCESS) return Result.Unsupported
            if (tts.setPitch(config.pitch) != TextToSpeech.SUCCESS) return Result.Unsupported

            val slices = delimiterAwareTextSplitter(
                fullText = text,
                maxSliceLength = TextToSpeech.getMaxSpeechInputLength(),
                charDelimiter = '.',
            )
            if (slices.isEmpty()) return Result.Empty

            var totalMs = 0L
            slices.forEachIndexed { index, slice ->
                if (slice.isBlank()) return@forEachIndexed

                val finished = CountDownLatch(1)
                val formatRef = AtomicReference<AudioFormatInfo?>(null)
                val errorRef = AtomicReference<Boolean>(false)
                var audioBytes = 0L

                tts.setOnUtteranceProgressListener(object : UtteranceProgressListener() {
                    override fun onStart(utteranceId: String?) = Unit

                    override fun onBeginSynthesis(
                        utteranceId: String?,
                        sampleRateInHz: Int,
                        audioFormat: Int,
                        channelCount: Int,
                    ) {
                        if (sampleRateInHz > 0 && channelCount > 0) {
                            formatRef.set(AudioFormatInfo(sampleRateInHz, audioFormat, channelCount))
                        }
                    }

                    override fun onAudioAvailable(utteranceId: String?, audio: ByteArray?) {
                        if (audio != null) audioBytes += audio.size.toLong()
                    }

                    override fun onDone(utteranceId: String?) {
                        finished.countDown()
                    }

                    override fun onError(utteranceId: String?, errorCode: Int) {
                        errorRef.set(true)
                        finished.countDown()
                    }

                    @Deprecated("Deprecated in Java")
                    override fun onError(utteranceId: String?) {
                        errorRef.set(true)
                        finished.countDown()
                    }
                })

                val utteranceId = "duration-$index-${System.nanoTime()}"
                val outputFd = openNullOutput()
                    ?: return Result.Unsupported
                try {
                    val result = tts.synthesizeToFile(
                        slice,
                        Bundle().apply {
                            putString(TextToSpeech.Engine.KEY_PARAM_UTTERANCE_ID, utteranceId)
                        },
                        outputFd,
                        utteranceId,
                    )
                    if (result != TextToSpeech.SUCCESS) return Result.Unsupported
                    if (!finished.await(timeoutPerSliceMs, TimeUnit.MILLISECONDS)) return Result.Failed
                    if (errorRef.get()) return Result.Failed
                } finally {
                    runCatching { outputFd.close() }
                }

                val format = formatRef.get() ?: return Result.Unsupported
                val bytesPerSample = when (format.audioFormat) {
                    android.media.AudioFormat.ENCODING_PCM_8BIT -> 1
                    android.media.AudioFormat.ENCODING_PCM_16BIT -> 2
                    android.media.AudioFormat.ENCODING_PCM_FLOAT -> 4
                    android.media.AudioFormat.ENCODING_PCM_24BIT -> 3
                    android.media.AudioFormat.ENCODING_PCM_32BIT -> 4
                    else -> return Result.Unsupported
                }
                val bytesPerFrame = bytesPerSample.toLong() * format.channelCount
                if (bytesPerFrame <= 0L || format.sampleRate <= 0 || audioBytes <= 0L || audioBytes % bytesPerFrame != 0L) {
                    return Result.Failed
                }

                val frames = audioBytes / bytesPerFrame
                if (frames <= 0L) return Result.Failed
                totalMs += (frames * 1000L) / format.sampleRate.toLong()
                if (totalMs <= 0L) return Result.Failed
            }

            if (totalMs <= 0L) return Result.Failed
            cacheDuration(text, config, totalMs)
            Result.Measured(totalMs)
        } catch (_: InterruptedException) {
            Result.Failed
        } catch (_: Exception) {
            Result.Failed
        } finally {
            runCatching { tts?.stop() }
            runCatching { tts?.shutdown() }
            if (activeTts === tts) activeTts = null
        }
    }

    private fun openNullOutput(): ParcelFileDescriptor? =
        runCatching {
            ParcelFileDescriptor.open(File("/dev/null"), ParcelFileDescriptor.MODE_WRITE_ONLY)
        }.getOrNull()

    private fun cacheKey(text: String, config: Config): String {
        val material = buildString {
            append(NORMALIZATION_VERSION).append('|')
            append(config.enginePackage).append('|')
            append(config.voiceId).append('|')
            append(config.localeTag).append('|')
            append(config.speed).append('|')
            append(config.pitch).append('|')
            append(text)
        }
        val digest = MessageDigest.getInstance("SHA-256")
            .digest(material.toByteArray(Charsets.UTF_8))
        return cachePrefix + digest.joinToString("") { "%02x".format(it) }
    }

    companion object {
        private const val NORMALIZATION_VERSION = 1
    }
}
''', encoding='utf-8')

          # ------------------------------------------------------------
          # Unit tests for normalization and cache-key identity.
          # ------------------------------------------------------------
          tests = root / 'tooling/text_to_speech/src/test/java/my/noveldokusha/text_to_speech/ChapterTtsDurationNormalizerTest.kt'
          tests.parent.mkdir(parents=True, exist_ok=True)
          tests.write_text(r'''package my.noveldokusha.text_to_speech

import org.junit.Assert.assertEquals
import org.junit.Assert.assertThrows
import org.junit.Test

internal object TtsDurationMath {
    fun durationMs(frameCount: Long, sampleRate: Int): Long {
        require(frameCount > 0)
        require(sampleRate > 0)
        return (frameCount * 1000L) / sampleRate.toLong()
    }
}

class ChapterTtsDurationNormalizerTest {
    @Test
    fun `48000 frames at 48000 Hz equals one second`() {
        assertEquals(1000L, TtsDurationMath.durationMs(48_000, 48_000))
    }

    @Test
    fun `96000 frames at 48000 Hz equals two seconds`() {
        assertEquals(2000L, TtsDurationMath.durationMs(96_000, 48_000))
    }

    @Test
    fun `44100 frames at 44100 Hz equals one second`() {
        assertEquals(1000L, TtsDurationMath.durationMs(44_100, 44_100))
    }

    @Test
    fun `zero frames are rejected`() {
        assertThrows(IllegalArgumentException::class.java) {
            TtsDurationMath.durationMs(0, 48_000)
        }
    }

    @Test
    fun `zero sample rate is rejected`() {
        assertThrows(IllegalArgumentException::class.java) {
            TtsDurationMath.durationMs(1_000, 0)
        }
    }
}
''', encoding='utf-8')

