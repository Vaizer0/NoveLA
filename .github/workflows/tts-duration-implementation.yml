          block = re.compile(r'''        Surface\(\n            shape = RoundedCornerShape\(16\.dp\),\n            color = MaterialTheme\.colorScheme\.primaryContainer,\n        \) \{\n            Row\(\n                verticalAlignment = Alignment\.CenterVertically,\n                modifier = Modifier\.padding\(horizontal = badgeHorizPad, vertical = badgeVertPad\)\n            \) \{\n                Icon\(\n                    Icons\.Rounded\.AccessTime,\n                    contentDescription = null,\n                    tint = MaterialTheme\.colorScheme\.onPrimaryContainer,\n                    modifier = Modifier\.size\(14\.dp\)\n                \)\n                Spacer\(Modifier\.width\(4\.dp\)\)\n                Text\(\n                    text = formatDuration\(remaining\),\n                    style = MaterialTheme\.typography\.labelSmall,\n                    fontWeight = FontWeight\.Bold,\n                    color = MaterialTheme\.colorScheme\.onPrimaryContainer,\n                \)\n            \}\n        \}\n''')
          replacement = '''        if (durationEnabled) {\n            Text(\n                text = formatDuration(current),\n                style = MaterialTheme.typography.labelSmall,\n                fontWeight = FontWeight.Medium,\n                color = MaterialTheme.colorScheme.onSurfaceVariant,\n            )\n            Text(\n                text = if (showTotalDuration) formatDuration((state.chapterTtsDurationMs.value ?: 0L).div(1000L).toInt()) else "-${formatDuration(remaining)}",\n                style = MaterialTheme.typography.labelSmall,\n                fontWeight = FontWeight.Medium,\n                color = MaterialTheme.colorScheme.onSurfaceVariant,\n                modifier = Modifier.clip(RoundedCornerShape(4.dp)).clickable(onClick = onToggleDurationMode).padding(horizontal = 2.dp, vertical = 1.dp),\n            )\n        } else {\n            Surface(\n                shape = RoundedCornerShape(16.dp),\n                color = MaterialTheme.colorScheme.primaryContainer,\n            ) {\n                Row(\n                    verticalAlignment = Alignment.CenterVertically,\n                    modifier = Modifier.padding(horizontal = badgeHorizPad, vertical = badgeVertPad)\n                ) {\n                    Icon(\n                        Icons.Rounded.AccessTime,\n                        contentDescription = null,\n                        tint = MaterialTheme.colorScheme.onPrimaryContainer,\n                        modifier = Modifier.size(14.dp)\n                    )\n                    Spacer(Modifier.width(4.dp))\n                    Text(\n                        text = formatDuration(remaining),\n                        style = MaterialTheme.typography.labelSmall,\n                        fontWeight = FontWeight.Bold,\n                        color = MaterialTheme.colorScheme.onPrimaryContainer,\n                    )\n                }\n            }\n        }\n'''
          if block.search(text):
              text = block.sub(replacement, text, count=1)
          call = '''                        animatedProgress = animatedProgress,\n                        remaining = remaining,\n'''
          if call in text and 'current = current' not in text:
              text = text.replace(call, '''                        animatedProgress = animatedProgress,\n                        current = current,\n                        remaining = remaining,\n                        durationEnabled = durationEnabled,\n                        showTotalDuration = showTotalDuration,\n                        onToggleDurationMode = { showTotalDuration = !showTotalDuration },\n''', 1)
          write(mini, text)

          print('Applied TTS duration implementation')
          PY

      - name: Commit implementation changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add accurate TTS chapter duration [skip ci]" || true
          git push origin HEAD:feat/tts-chapter-duration

      - name: Verify tests and APK build
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :tooling:text_to_speech:test --no-daemon --console=plain
          ./gradlew :app:assembleDebug --no-daemon --console=plain
          ./gradlew :app:assembleRelease --no-daemon --console=plain

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: NoveLA-tts-duration-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Remove temporary workflow after green build
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/tts-duration-implementation.yml
          git add .github/workflows/tts-duration-implementation.yml
          git commit -m "chore: remove temporary implementation workflow [skip ci]" || true
          git push origin HEAD:feat/tts-chapter-duration
