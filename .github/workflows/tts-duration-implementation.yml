name: Implement TTS Chapter Duration

on:
  push:
    branches:
      - feat/tts-chapter-duration

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/tts-chapter-duration
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Apply implementation
        run: python3 tools/implement_tts_duration.py

      - name: Verify changes compile and tests pass
        run: |
          set -euo pipefail
          ./gradlew :tooling:text_to_speech:test --no-daemon --console=plain
          ./gradlew :app:assembleDebug --no-daemon --console=plain
          ./gradlew :app:assembleRelease --no-daemon --console=plain

      - name: Commit implementation
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/tts-duration-trigger.txt 2>/dev/null || true
          git rm -f tools/implement_tts_duration.py 2>/dev/null || true
          git rm -f .github/workflows/tts-duration-implementation.yml 2>/dev/null || true
          git add -A
          git commit -m "feat: add accurate TTS chapter duration [skip ci]"
          git push origin HEAD:feat/tts-chapter-duration

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: NoveLA-tts-duration-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error
