import org.junit.Assert.assertEquals
import org.junit.Assert.assertThrows
import org.junit.Test

internal object TtsDurationMath {
    fun durationMs(frameCount: Long, sampleRate: Int): Long {
        require(frameCount > 0)
        require(sampleRate > 0)
        return (frameCount * 1000L) / sampleRate.toLong()
    }
}

class ChapterTtsDurationNormalizerTest {
    @Test fun `48000 frames at 48000 Hz equals one second`() = assertEquals(1000L, TtsDurationMath.durationMs(48_000, 48_000))
    @Test fun `96000 frames at 48000 Hz equals two seconds`() = assertEquals(2000L, TtsDurationMath.durationMs(96_000, 48_000))
    @Test fun `44100 frames at 44100 Hz equals one second`() = assertEquals(1000L, TtsDurationMath.durationMs(44_100, 44_100))
    @Test fun `zero frames are rejected`() = assertThrows(IllegalArgumentException::class.java) { TtsDurationMath.durationMs(0, 48_000) }
    @Test fun `zero sample rate is rejected`() = assertThrows(IllegalArgumentException::class.java) { TtsDurationMath.durationMs(1_000, 0) }
}
