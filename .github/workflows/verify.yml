name: Verify

on:
  push:
    branches:
      - wavjsonmp4
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    name: Compile + Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Clone repo
        uses: actions/checkout@v7

      - name: Set up JDK environment
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.3.0

      - name: Remove local Java home from gradle.properties
        run: sed -i '/org\.gradle\.java\.home/d' gradle.properties

      - name: Compile debug Kotlin (all modules)
        run: ./gradlew compileDebugKotlin --continue

      # Полный testDebugUnitTest падает на pre-existing проблеме репозитория:
      # модули с test-исходниками, но без обнаруженных тестов, дают
      # "no filters are applied ... did not discover any tests". Это не связано
      # с изменениями ветки, поэтому тесты гоняются только для нового модуля.
      - name: Unit tests (audiobook export)
        run: ./gradlew :tooling:audiobook_export:testDebugUnitTest --continue
