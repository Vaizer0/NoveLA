name: Android CI - Build Debug APK

on:
  push:
    branches: [ main, default ]
  pull_request:
    branches: [ main, default ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v2
        with:
          api-levels: '33'
          build-tools: '33.0.0'

      - name: Install jq (for response parsing)
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: NoveLA-debug-apks
          path: '**/app/build/outputs/**/*.apk'

      # Optional: upload built APK to Appetize.io for browser testing.
      # To enable, add repository secret APPETIZE_UPLOAD_TOKEN (Appetize API token).
      - name: Upload to Appetize.io (optional)
        if: ${{ secrets.APPETIZE_UPLOAD_TOKEN }}
        run: |
          set -e
          for apk in $(find . -name "*-debug.apk"); do
            echo "Uploading $apk to Appetize.io..."
            resp=$(curl -s -X POST -H "Authorization: Bearer ${{ secrets.APPETIZE_UPLOAD_TOKEN }}" -F "file=@${apk}" https://api.appetize.io/v1/applications)
            echo "Appetize response: $resp"
            # Try to extract an identifier/token from response; print embed URL if available
            token=$(echo "$resp" | jq -r '.data.identifier // .data.uuid // .uuid // empty') || true
            if [ -n "$token" ]; then
              echo "Possible embed URL: https://appetize.io/embed/$token"
            fi
          done
