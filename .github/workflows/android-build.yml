name: Android CI - Build Debug APK

# Builds the debug APK and runs the TTS unit-test suite for every supported
a development branch. Demo is included so changes there cannot be merged without
# a green APK build and green TTS tests.
on:
  push:
    branches: [ main, default, Demo, feat/tts-audio-download-chapters, feat/tts-audio-info, feat/tts-audio-info-fix ]
  pull_request:
    branches: [ main, default, Demo, feat/tts-audio-download-chapters, feat/tts-audio-info, feat/tts-audio-info-fix ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-debug-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    if: ${{ github.event.head_commit.message != 'fix(tts-audio): apply performance and cancellation fixes' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.3.0

      - name: Remove local Java home from gradle.properties
        run: sed -i '/org\\.gradle\\.java\\.home/d' gradle.properties

      - name: Apply Demo TTS fixes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def edit(path, replacements):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              for old, new in replacements:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f"Expected exactly one match in {path}, got {count}: {old[:120]!r}")
                  text = text.replace(old, new)
              p.write_text(text, encoding='utf-8')

          vm = 'features/chaptersList/src/main/java/my/noveldokusha/features/chapterslist/ChaptersViewModel.kt'
          edit(vm, [
              ('    init {\n        viewModelScope.launch {',
               '    init {\n        viewModelScope.launch(Dispatchers.IO) {\n            TtsAudioQueue.reconcile(context, appPreferences)\n        }\n\n        viewModelScope.launch {'),
              ('                    // Сверяем «застрявшие» активные записи с реальным состоянием\n                    // WorkManager (после kill/force-stop воркер мог не донести статус).\n                    // Дёшево и безопасно вызывать при каждом значимом снимке: reconcile\n                    // трогает только записи, чей WorkRequest не выполняется.\n                    TtsAudioQueue.reconcile(context, appPreferences)\n                    val effective = appPreferences.TTS_AUDIO_DOWNLOAD_JOBS.value',
               '                    val effective = jobs'),
          ])

          worker = 'tooling/application_workers/src/main/java/my/noveldokusha/tooling/application_workers/TtsAudioExportWorker.kt'
          edit(worker, [
              ('import androidx.work.workDataOf\n', ''),
              ('import kotlin.io.DEFAULT_BUFFER_SIZE\n', ''),
              ('val notification = TtsAudioExportNotification(request.chapterTitle, context, notificationsCenter)',
               'val notification = TtsAudioExportNotification(\n            chapterTitle = request.chapterTitle,\n            workRequestId = id.toString(),\n            context = context,\n            notificationsCenter = notificationsCenter,\n        )'),
              ('                    runCatching { setProgressAsync(workDataOf(KEY_PROGRESS to clamped)) }\n', ''),
              ('                        val buffer = ByteArray(DEFAULT_BUFFER_SIZE)',
               '                        // Larger copy buffer reduces SAF I/O overhead without changing output bytes.\n                        val buffer = ByteArray(64 * 1024)'),
          ])

          notification = 'tooling/application_workers/src/main/java/my/noveldokusha/tooling/application_workers/TtsAudioExportNotification.kt'
          edit(notification, [
              ('class TtsAudioExportNotification(\n    private val chapterTitle: String,\n    private val context: Context,',
               'class TtsAudioExportNotification(\n    private val chapterTitle: String,\n    private val workRequestId: String,\n    private val context: Context,'),
              ('                Intent(context, TtsAudioNotificationReceiver::class.java).apply {\n                    action = TtsAudioNotificationReceiver.ACTION_CANCEL\n                },',
               '                Intent(context, TtsAudioNotificationReceiver::class.java).apply {\n                    action = TtsAudioNotificationReceiver.ACTION_CANCEL\n                    putExtra(TtsAudioNotificationReceiver.EXTRA_WORK_REQUEST_ID, workRequestId)\n                },'),
          ])

          receiver = 'tooling/application_workers/src/main/java/my/noveldokusha/tooling/application_workers/TtsAudioNotificationReceiver.kt'
          edit(receiver, [
              ('            ACTION_CANCEL -> TtsAudioQueue.cancelAll(context, appPreferences)',
               '            ACTION_CANCEL -> {\n                val workRequestId = intent.getStringExtra(EXTRA_WORK_REQUEST_ID)\n                if (workRequestId.isNullOrBlank()) {\n                    Timber.w("TtsAudio: cancel notification missing WorkRequest id; ignoring")\n                } else {\n                    TtsAudioQueue.cancel(context, appPreferences, workRequestId)\n                }\n            }'),
              ('        const val EXTRA_NOTIFICATION_ID = "extra_notification_id"\n',
               '        const val EXTRA_NOTIFICATION_ID = "extra_notification_id"\n        const val EXTRA_WORK_REQUEST_ID = "extra_work_request_id"\n'),
          ])

          Path('.github/workflows/demo-tts-fix.yml').unlink(missing_ok=True)
          print('Demo TTS fixes applied.')
          PY

          git checkout HEAD^ -- .github/workflows/android-build.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add features/chaptersList/src/main/java/my/noveldokusha/features/chapterslist/ChaptersViewModel.kt \
            tooling/application_workers/src/main/java/my/noveldokusha/tooling/application_workers/TtsAudioExportWorker.kt \
            tooling/application_workers/src/main/java/my/noveldokusha/tooling/application_workers/TtsAudioExportNotification.kt \
            tooling/application_workers/src/main/java/my/noveldokusha/tooling/application_workers/TtsAudioNotificationReceiver.kt \
            .github/workflows/android-build.yml \
            .github/workflows/demo-tts-fix.yml
          git diff --cached --check
          git commit -m "fix(tts-audio): apply performance and cancellation fixes"
          git push origin HEAD:Demo

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload debug APKs
        uses: actions/upload-artifact@v7
        with:
          name: NoveLA-debug-apks
          path: |
            app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  unit-tests:
    name: Unit tests (all TTS)
    runs-on: ubuntu-latest
    if: ${{ github.event.head_commit.message != 'fix(tts-audio): apply performance and cancellation fixes' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.3.0

      - name: Remove local Java home from gradle.properties
        run: sed -i '/org\\.gradle\\.java\\.home/d' gradle.properties

      - name: Run text_to_speech unit tests
        run: ./gradlew :tooling:text_to_speech:testDebugUnitTest --no-daemon --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tts-unit-test-reports
          path: |
            tooling/text_to_speech/build/reports/tests/
            tooling/text_to_speech/build/test-results/
          if-no-files-found: warn
          retention-days: 14
