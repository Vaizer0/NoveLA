name: Validate Release Workflow

on:
  push:
    branches:
      - feat/youtube-tts-video-generation-system

permissions:
  actions: write
  contents: read

concurrency:
  group: validate-release-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch buildRelease test workflow for this commit
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          curl --fail-with-body -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${OWNER}/${REPO}/actions/workflows/buildRelease.yml/dispatches" \
            -d "$(python3 - <<'PY'
          import json, os
          print(json.dumps({"ref": os.environ["REF"], "inputs": {"build_type": "test"}}))
          PY
          )"
