name: temporary live TTS queue fix

on:
  push:
    branches: [Demo]
    paths-ignore:
      - .github/workflows/_tmp_fix_live_tts.sh.yml

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.event.head_commit.message != 'fix(tts): reduce live TTS queue for export coexistence' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Demo
          fetch-depth: 0
      - name: Patch live TTS queue
        shell: bash
        run: |
          set -euo pipefail
          file='features/reader/src/main/java/my/noveldokusha/features/reader/features/ReaderTextToSpeech.kt'
          python3 - <<'PY'
          from pathlib import Path
          p = Path('features/reader/src/main/java/my/noveldokusha/features/reader/features/ReaderTextToSpeech.kt')
          s = p.read_text()
          old = '    private val halfBuffer = 5\n'
          new = '''    // Keep only one live utterance ahead. Android TTS engines may serialize synthesis\n    // across clients, so a deep live queue can starve background synthesizeToFile() exports.\n    // A one-item look-ahead preserves continuous live playback while allowing exports to\n    // interleave instead of waiting behind five pre-queued live utterances.\n    private val halfBuffer = 1\n'''
          if old not in s:
              raise SystemExit('expected halfBuffer declaration not found')
          p.write_text(s.replace(old, new, 1))
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$file"
          git commit -m 'fix(tts): reduce live TTS queue for export coexistence'
          git push origin HEAD:Demo
      - name: Remove temporary workflow
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin Demo
          git checkout Demo
          rm -f .github/workflows/_tmp_fix_live_tts.sh.yml
          git add .github/workflows/_tmp_fix_live_tts.sh.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: remove temporary live TTS fix workflow'
          git push origin HEAD:Demo
