name: TTS duration runtime sync

on:
  push:
    branches:
      - feat/tts-chapter-duration
  workflow_dispatch:

permissions:
  contents: write

env:
  JAVA_VERSION: '21'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/tts-chapter-duration
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Apply runtime synchronization fix
        run: python3 tools/fix_tts_duration_runtime_ui.py

      - name: Verify runtime synchronization source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('features/reader/src/main/java/my/noveldokusha/features/reader/ui/ReaderScreen.kt').read_text()
          assert 'Keep the already-running floating player synchronized' in p
          assert 'FloatingTtsService.ttsState.value = state.settings.textToSpeech' in p
          assert 'FloatingTtsService.recreateOverlay()' in p
          print('Runtime synchronization assertions passed.')
          PY

      - name: Run TTS duration unit tests
        run: ./gradlew :tooling:text_to_speech:test --no-daemon --console=plain

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --console=plain

      - name: Build Release APK
        run: ./gradlew :app:assembleRelease --no-daemon --console=plain

      - name: Verify APK artifacts
        run: |
          test -n "$(find app/build/outputs/apk/debug -name '*.apk' -type f -print -quit)"
          test -n "$(find app/build/outputs/apk/release -name '*.apk' -type f -print -quit)"
          echo 'Debug and Release APK artifacts exist.'

      - name: Commit verified runtime synchronization fix and remove temporary tooling
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add features/reader/src/main/java/my/noveldokusha/features/reader/ui/ReaderScreen.kt
          git rm -f tools/fix_tts_duration_runtime_ui.py .github/workflows/tts-duration-runtime-sync.yml
          git commit -m "fix: synchronize TTS duration with floating player [skip ci]"
          git push origin HEAD:feat/tts-chapter-duration
