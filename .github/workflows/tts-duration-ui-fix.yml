name: TTS duration UI fix

on:
  push:
    branches:
      - feat/tts-chapter-duration
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-build-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/tts-chapter-duration
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify intended source changes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          voice = Path('features/reader/src/main/java/my/noveldokusha/features/reader/ui/settingDialogs/VoiceReaderSettingDialog.kt').read_text()
          more = Path('features/reader/src/main/java/my/noveldokusha/features/reader/ui/settingDialogs/MoreSettingDialog.kt').read_text()
          bar = Path('features/reader/src/main/java/my/noveldokusha/features/reader/ui/ReaderScreenBottomBarDialogs.kt').read_text()
          assert 'ttsDurationEnabled' not in voice, 'Duration toggle still present in VoiceReaderSettingDialog'
          assert more.count('ttsDurationEnabled: Boolean') == 1, 'MoreSettingDialog toggle state missing/duplicated'
          assert more.index('// TTS chapter duration') < more.index('// Manual highlight'), 'Duration toggle is not above Manual Highlight'
          assert 'ttsDurationEnabled = settings.textToSpeech.ttsDurationEnabled.value' in bar
          assert 'onTtsDurationEnabledChange = settings.textToSpeech.setTtsDurationEnabled' in bar
          print('UI placement and wiring assertions passed.')
          PY

      - name: Run TTS duration unit tests
        run: ./gradlew :tooling:text_to_speech:test --no-daemon --console=plain

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --console=plain

      - name: Build Release APK
        run: ./gradlew :app:assembleRelease --no-daemon --console=plain

      - name: Commit UI fix and remove temporary UI tooling
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add features/reader/src/main/java/my/noveldokusha/features/reader/ui/settingDialogs/MoreSettingDialog.kt
          git add features/reader/src/main/java/my/noveldokusha/features/reader/ui/ReaderScreenBottomBarDialogs.kt
          git add features/reader/src/main/java/my/noveldokusha/features/reader/ui/settingDialogs/VoiceReaderSettingDialog.kt
          git rm -f tools/fix_tts_duration_ui.py .github/workflows/tts-duration-ui-fix.yml 2>/dev/null || true
          git add -A
          git commit -m "fix: place TTS duration toggle in More menu [skip ci]"
          git push origin HEAD:feat/tts-chapter-duration

      - name: Verify APK artifacts exist
        run: |
          test -n "$(find app/build/outputs/apk/debug -name '*.apk' -type f -print -quit)"
          test -n "$(find app/build/outputs/apk/release -name '*.apk' -type f -print -quit)"
